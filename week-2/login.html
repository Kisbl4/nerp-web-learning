<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в личный кабинет</title>
</head>
<body>
<form action="/login" method="post">
    <label for="email">Электронная почта</label>
    <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
    />
    <button type="button">Получить код</button>
    <label for="6num">Шестизначный код</label>
    <input
            id="6num"
            name="6num"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
    />
    <button type="button">Войти</button>
    <button type="button"></button>
</form>

<footer>
    <ul>
        <li><a href="about.html">Политика конфидициальности</a></li>
        <li><a href="about.html">Условия использования</a></li>
    </ul>

</footer>

</body>
</html>
