<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="/login" method="post">
    <label for="email">Электронная почта</label>
    <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
    />

    <label for="code">Код из письма</label>
    <input
            id="code"
            name="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
    />

    <button type="button">Отправить код ещё раз</button>
    <button type="submit">Войти</button>
    <a href="about.html">Войти через Telegram</a>

</form>
<footer>
    <ul>
        <li>
            <a href="login.html">Политика конфидициальности</a>
        </li>
        <li>
            <a href="n">Условия использования</a>
        </li>
    </ul>
    </footer>
</body>
</html>
